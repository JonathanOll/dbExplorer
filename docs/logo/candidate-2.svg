<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>dbExplorer - candidate 2 (result grid)</title>
  <defs>
    <linearGradient id="tile" gradientUnits="userSpaceOnUse" x1="20" y1="8" x2="236" y2="248">
      <stop offset="0" stop-color="#4F8FD0"/><stop offset="1" stop-color="#2D5887"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#sheen)"/>
  <!-- header row and row-number column frame the data like a spreadsheet -->
  <g fill="#fff">
    <rect x="45" y="45" width="34" height="34" rx="9"/>
    <rect x="89" y="45" width="56" height="34" rx="9"/><rect x="155" y="45" width="56" height="34" rx="9"/>
    <rect x="45" y="89" width="34" height="34" rx="9"/><rect x="45" y="133" width="34" height="34" rx="9"/><rect x="45" y="177" width="34" height="34" rx="9"/>
  </g>
  <!-- data cells; one selected -->
  <g fill="#fff" fill-opacity=".26">
    <rect x="89" y="89" width="56" height="34" rx="9"/><rect x="155" y="89" width="56" height="34" rx="9"/>
    <rect x="89" y="133" width="56" height="34" rx="9"/>
    <rect x="89" y="177" width="56" height="34" rx="9"/><rect x="155" y="177" width="56" height="34" rx="9"/>
  </g>
  <rect x="155" y="133" width="56" height="34" rx="9" fill="#BFDAF6"/>
</svg>
