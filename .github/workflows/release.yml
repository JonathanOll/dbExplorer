name: release

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions: 
    contents: write

concurrency:
    group: release
    cancel-in-progress: true

env:
    GV_VERSION: '6.4.x'

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install GitVersion
              uses: gittools/actions/gitversion/setup@v4.1.0
              with:
                versionSpec: ${{ env.GV_VERSION }}
            
            - name: Determine Version
              id: version
              uses: gittools/actions/gitversion/execute@v4.1.0

            - name: Push tags
              if: ${{ github.ref == 'refs/heads/main' }}
              run: git tag v${{ steps.version.outputs.SemVer }} && git push origin v${{ steps.version.outputs.SemVer }}

            - name: Install .NET
              uses: actions/setup-dotnet@v4
              with: 
                  dotnet-version: '10.0.x'

            - name: Restore
              run: dotnet restore

            - name: Publish
              run: |
                  dotnet publish src/DbExplorer.App/DbExplorer.App.csproj \
                  -c Release \
                  -o publish
            
            - name: Zip
              run: |
                  cd publish
                  zip -r ../DbExplorer.zip .

            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                  files: DbExplorer.zip