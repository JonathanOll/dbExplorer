name: release

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions: 
    contents: write

concurrency:
    group: release
    cancel-in-progress: true

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install .NET
              uses: actions/setup-dotnet@v4
              with: 
                  dotnet-version: '10.0.x'

            - name: Restore
              run: dotnet restore

            - name: Publish
              run: |
                  dotnet publish src/DbExplorer.App/DbExplorer.App.csproj \
                  -c Release \
                  -o publish
            
            - name: Zip
              run: |
                  cd publish
                  zip -r ../DbExplorer.zip .

            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                  files: DbExplorer.zip